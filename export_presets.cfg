[preset.0]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="checks/*,skiing/check_runs.gd,*.log,README.md,build/*,web/*,demo/browser_fonts/*"
export_path="build/Little Lifts.app"

[preset.0.options]

application/architecture="arm64"
application/icon="res://demo/icon.png"
application/name="Little Lifts"
application/bundle_identifier="org.littlelifts.demo"
application/short_version="0.4.1"
application/version="0.4.1"
codesign/codesign=1

[preset.1]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="checks/*,skiing/check_runs.gd,*.log,README.md,build/*,web/*"
export_path="build/web/index.html"

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
